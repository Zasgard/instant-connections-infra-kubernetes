{{- if .Values.jitsi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "instant-connections.fullname" . }}-jitsi-web
  labels:
    {{- include "instant-connections.labels" . | nindent 4 }}
    app.kubernetes.io/component: jitsi-web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "instant-connections.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: jitsi-web
{{- end }}
