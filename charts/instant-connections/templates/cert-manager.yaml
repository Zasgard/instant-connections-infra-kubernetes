{{- if and .Values.certManager.enabled .Values.ingress.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.certManager.clusterIssuerName }}
spec:
  acme:
    server: {{ .Values.certManager.server }}
    email: {{ .Values.certManager.email }}
    privateKeySecretRef:
      name: {{ .Values.certManager.clusterIssuerName }}
    solvers:
      - http01:
          ingress:
            class: {{ .Values.ingress.className }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "instant-connections.fullname" . }}-app-cert
spec:
  secretName: {{ .Values.ingress.tls.appSecretName }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.certManager.clusterIssuerName }}
  dnsNames:
    - {{ .Values.ingress.appHost }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "instant-connections.fullname" . }}-meet-cert
spec:
  secretName: {{ .Values.ingress.tls.meetSecretName }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.certManager.clusterIssuerName }}
  dnsNames:
    - {{ .Values.ingress.meetHost }}
{{- end }}
